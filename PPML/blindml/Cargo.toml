[package]
name = "blindml"
version = "0.1.0"
edition = "2021"

[features]
default = []
gpu = ["ppml_core/gpu", "tfhe/gpu"]

[lib]
name = "blindml"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
tfhe = { version = "1.5", features = ["integer"] }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
ppml_core = { path = "../ppml_core" }
