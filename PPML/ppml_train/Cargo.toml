[package]
name = "ppml_train"
version = "0.1.0"
edition = "2021"

[features]
default = []
gpu = ["ppml_core/gpu"]

[[bin]]
name = "train"
path = "src/main.rs"

[[bin]]
name = "infer"
path = "src/bin/infer.rs"

[[bin]]
name = "encrypt_dataset"
path = "src/bin/encrypt_dataset.rs"

[[bin]]
name = "verify_dataset"
path = "src/bin/verify_dataset.rs"

[dependencies]
bincode = "1.3"
rand = "0.8"
ppml_core = { path = "../ppml_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tfhe = { version = "1.5", features = ["integer"] }
tracing = "0.1"
tracing-subscriber = "0.3"
