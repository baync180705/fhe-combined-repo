[package]
name = "ppml_core"
version = "0.1.0"
edition = "2021"

[features]
default = []
gpu = ["tfhe/gpu"]

[dependencies]
bincode = "1.3"
rand = "0.8"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tfhe = { version = "1.5", features = ["integer", "shortint", "boolean", "experimental"] }
thiserror = "1.0"
tracing = "0.1"
